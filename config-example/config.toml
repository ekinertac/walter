# All settings optional. See docs/config.md. Missing config is created locally.
[theme]
# name = "catppuccin-mocha"
background = "#1e1e2e"
foreground = "#cdd6f4"
accent = "#cba6f7"
border_radius = 12
font = "SF Pro"
font_weight = "medium"
blur_material = "hudWindow"

[layout]
width = 780
max_results = 8
placeholder = "Search apps, calculate, convert..."
mode = "list" # list | grid; fixed scale, top edge 30% down the pointer screen

[keybindings]
open = "Cmd+Space"
close = "Escape"

[search]
web_search = "google"
show_path = true
# excluded_apps = Example, Another App

# Only HTTP(S) URLs and real apps resolved inside /Applications.
[aliases]
# example = "/Applications/Example.app"
gh = "https://github.com"

[aliases.y]
name = "YouTube"
url = "https://www.youtube.com/results?search_query={query}"
